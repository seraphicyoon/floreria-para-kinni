<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florería Jinni & Kat 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            background: linear-gradient(180deg, #fce4ec 0%, #ffebee 100%);
            min-height: 100vh;
        }
        .font-floral { font-family: 'Dancing Script', cursive; }
        .flower-bounce { animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.05); } }
    </style>
</head>
<body class="flex flex-col items-center p-6 text-[#880e4f]">

    <header class="text-center mb-8">
        <h1 class="text-5xl font-floral mb-2 text-[#ad1457]">Florería Jinni & Kat</h1>
        <p class="text-sm italic opacity-70">"Nuestro jardín compartido" ✨</p>
    </header>

    <div id="jardin" class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-10 w-full max-w-2xl">
        <p class="text-center col-span-full opacity-50 p-10">Cargando las flores que Jinni plantó... 🌸</p>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        const urlWebhook = "https://canary.discord.com/api/webhooks/1503544004778659940/23r_AuAZiGuyR6U_pRtVem7N1BpxbOmpFsOPKaXxxT9fQ7Lgaq72pcjXG7q8zR0LS38P";
const supabaseUrl = 'https://bleuixyaaqkdltywqkrm.supabase.co'; 
const supabaseKey = 'sb_publishable_axaQYh1UizlxyLN35niObA_F78gCwoB';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // LIMPIEZA AUTOMÁTICA: Borra rastros de versiones anteriores
        if (!localStorage.getItem('limpieza_v1')) {
            localStorage.clear();
            localStorage.setItem('limpieza_v1', 'true');
        }

        async function cargarFlores() {
            const { data, error } = await supabaseClient
                .from('jardin')
                .select('*')
                .order('created_at', { ascending: true });

            const container = document.getElementById('jardin');
            
            if (error) {
                container.innerHTML = `<p class="text-center col-span-full text-red-400">Error al conectar con la florería :(</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-center col-span-full opacity-50 p-10 bg-white/30 rounded-3xl border-2 border-dashed border-pink-200">El jardín está vacío... <br> ¡Jinni aún no ha plantado nada hoy! 🥀</p>`;
                return;
            }

            container.innerHTML = '';
            const ahora = Date.now();

            data.forEach(f => {
                // Lógica de 24 horas: 86,400,000 ms
                const tiempoRestante = Math.max(0, (Number(f.ultimo_riego) + 86400000) - ahora);
                const puedeRegar = tiempoRestante === 0;
                
                let visualHTML = f.nivel === 1 
                    ? `<i data-lucide="sprout" style="stroke: #66bb6a; width:80px; height:80px;"></i>`
                    : `<i data-lucide="${f.icono}" class="${puedeRegar ? 'flower-bounce' : ''}" style="stroke: ${f.color}; fill: ${f.color}20; width:80px; height:80px;"></i>`;

                container.innerHTML += `
                    <div class="bg-white/90 backdrop-blur-sm p-6 rounded-[2rem] shadow-lg border-b-4 border-pink-200 text-center flex flex-col items-center">
                        <div class="mb-4 h-20 flex items-center justify-center">${visualHTML}</div>
                        <h3 class="font-floral text-3xl mb-1" style="color: ${f.color}">${f.nombre_flor}</h3>
                        <p class="text-[10px] uppercase tracking-tighter text-pink-300 mb-4 font-bold">Nivel de Amor: ${f.nivel}</p>
                        
                        ${puedeRegar ? 
                            `<button onclick="regar('${f.id}', '${f.nombre_flor}', ${f.nivel})" class="bg-[#f06292] text-white px-6 py-2 rounded-2xl hover:scale-105 transition-all shadow-md flex items-center gap-2">
                                <i data-lucide="droplet" class="w-4 h-4"></i> Regar
                            </button>` :
                            `<div class="text-[11px] text-gray-400 bg-gray-50 px-4 py-2 rounded-full flex items-center gap-2">
                                <i data-lucide="clock" class="w-3 h-3"></i> Vuelve en ${formatearTiempo(tiempoRestante)}
                            </div>`
                        }
                    </div>
                `;
            });
            lucide.createIcons();
        }

        async function regar(id, nombre, nivelActual) {
            const { error } = await supabaseClient
                .from('jardin')
                .update({ nivel: nivelActual + 1, ultimo_riego: Date.now() })
                .eq('id', id);

            if (!error) {
                // Aviso a Discord
                await fetch(urlWebhook, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        content: `🌸 **Kat** ha regado su **${nombre}** en la florería. \n✨ ¡Ahora es nivel **${nivelActual + 1}**!`
                    })
                });
                cargarFlores();
            }
        }

        function formatearTiempo(ms) {
            let h = Math.floor(ms / 3600000);
            let m = Math.floor((ms % 3600000) / 60000);
            return `${h}h ${m}m`;
        }

        // Carga inicial y actualización cada minuto
        cargarFlores();
        setInterval(cargarFlores, 60000);
    </script>
</body>
</html>
