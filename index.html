<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florería Jinni & Kat 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Quicksand', sans-serif; background: linear-gradient(180deg, #fce4ec 0%, #ffebee 100%); min-height: 100vh; }
        .font-floral { font-family: 'Dancing Script', cursive; }
        .flower-bounce { animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.05); } }
        .flower-icon { width: 80px; height: 80px; stroke-width: 1.5; }
    </style>
</head>
<body class="flex flex-col items-center p-6 text-[#880e4f]">

    <header class="text-center mb-8">
        <h1 class="text-5xl font-floral mb-2 text-[#ad1457]">Florería Jinni & Kat</h1>
        <p class="text-sm italic opacity-70">"Cultivando nuestro sueño de tener una florería juntas" ✨</p>
    </header>

    <div id="jardin" class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-10 w-full max-w-2xl">
        </div>

    <script>
        const urlWebhook = "https://discord.com/api/webhooks/1503544004778659940/23r_AuAZiGuyR6U_pRtVem7N1BpxbOmpFsOPKaXxxT9fQ7Lgaq72pcjXG7q8zR0LS38P";

        // --- AQUÍ ES DONDE TÚ SIEMBRAS LAS FLORES ---
        // Solo añade una línea nueva dentro de los corchetes [] para cada flor nueva.
        const floresIniciales = [
            { id: "flor1", tipo: "Tulipán Rosa", icono: "flower-2", color: "#f06292" },
            { id: "flor2", tipo: "Girasol Radiante", icono: "sun", color: "#fbc02d" },
            { id: "flor3", tipo: "Rosa de Amor", icono: "tent-tree", color: "#e53935" }
        ];

        let progresoFlores = JSON.parse(localStorage.getItem('progreso_jardin')) || {};

        function renderJardin() {
            const container = document.getElementById('jardin');
            container.innerHTML = '';
            const ahora = Date.now();

            floresIniciales.forEach((flor) => {
                const datos = progresoFlores[flor.id] || { nivel: 1, ultimoRiego: 0 };
                const tiempoRestante = Math.max(0, (datos.ultimoRiego + 86400000) - ahora);
                const puedeRegar = tiempoRestante === 0;
                
                let visualHTML = datos.nivel === 1 
                    ? `<i data-lucide="sprout" class="flower-icon" style="stroke: #66bb6a;"></i>`
                    : `<i data-lucide="${flor.icono}" class="flower-icon ${puedeRegar ? 'flower-bounce' : ''}" style="stroke: ${flor.color}; fill: ${flor.color}20;"></i>`;

                container.innerHTML += `
                    <div class="bg-white/90 backdrop-blur-sm p-6 rounded-[2rem] shadow-lg border-b-4 border-pink-200 text-center flex flex-col items-center">
                        <div class="mb-4 h-20 flex items-center justify-center">${visualHTML}</div>
                        <h3 class="font-floral text-3xl mb-1" style="color: ${flor.color}">${flor.tipo}</h3>
                        <p class="text-[10px] uppercase tracking-tighter text-pink-300 mb-4 font-bold">Nivel de Cuidado: ${datos.nivel}</p>
                        ${puedeRegar ? 
                            `<button onclick="regar('${flor.id}', '${flor.tipo}')" class="bg-[#f06292] text-white px-6 py-2 rounded-2xl hover:scale-105 transition-all shadow-md">Regar con amor 💧</button>` :
                            `<div class="text-[11px] text-gray-400 bg-gray-50 px-4 py-2 rounded-full">Próximo riego en ${formatearTiempo(tiempoRestante)}</div>`
                        }
                    </div>`;
            });
            lucide.createIcons();
        }

        async function regar(id, tipo) {
            if (!progresoFlores[id]) progresoFlores[id] = { nivel: 1, ultimoRiego: 0 };
            
            progresoFlores[id].nivel += 1;
            progresoFlores[id].ultimoRiego = Date.now();
            
            localStorage.setItem('progreso_jardin', JSON.stringify(progresoFlores));

            // Notificación a Discord
            await fetch(urlWebhook, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    embeds: [{
                        title: "¡Kat regó el jardín! 💧",
                        description: `Ha cuidado su **${tipo}**. El nivel subió a **${progresoFlores[id].nivel}**.`,
                        color: 15158332
                    }]
                })
            });

            renderJardin();
        }

        function formatearTiempo(ms) {
            let h = Math.floor(ms / 3600000);
            let m = Math.floor((ms % 3600000) / 60000);
            return `${h}h ${m}m`;
        }

        renderJardin();
        setInterval(renderJardin, 60000);
    </script>
</body>
</html>
