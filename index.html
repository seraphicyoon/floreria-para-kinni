<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florería Jinni & Kat 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            background: linear-gradient(180deg, #fce4ec 0%, #ffebee 100%);
            min-height: 100vh;
        }
        .font-floral { font-family: 'Dancing Script', cursive; }
        
        /* Animación de rebote suave */
        .flower-bounce { animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.05); } }

        /* Efecto de Brillo (Sparkles) */
        .sparkle {
            animation: twinkle 1.5s infinite;
            position: absolute;
            pointer-events: none;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1.2); } }

        /* Efecto de Mariposas */
        .butterfly {
            position: absolute;
            animation: fly 4s infinite ease-in-out;
            font-size: 1.2rem;
            pointer-events: none;
        }
        @keyframes fly {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(15px, -15px) rotate(15deg); }
            50% { transform: translate(0, -30px) rotate(0deg); }
            75% { transform: translate(-15px, -15px) rotate(-15deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        #contenedor-cartas::-webkit-scrollbar { width: 6px; }
        #contenedor-cartas::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col items-center p-6 text-[#880e4f]">

    <header class="text-center mb-6">
        <h1 class="text-5xl font-floral mb-2 text-[#ad1457]">Florería Jinni & Kat</h1>
        <p class="text-sm italic opacity-70">"Nuestro jardín compartido" ✨</p>
    </header>

    <div id="panel-riego-global" class="w-full max-w-2xl bg-white/60 backdrop-blur-md p-4 rounded-3xl shadow-md border border-pink-200 text-center mb-6 flex flex-col items-center justify-center min-h-[80px]">
        <p class="text-xs opacity-60">Evaluando la humedad de la tierra... 🌱</p>
    </div>

    <div id="jardin" class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-10 w-full max-w-2xl bg-emerald-900/5 backdrop-blur-sm p-6 rounded-[2.5rem] border-4 border-dashed border-pink-300/60 min-h-[200px]">
        <p class="text-center col-span-full opacity-50 p-10">Cargando el jardín mágico... 🌸</p>
    </div>

    <div class="max-w-2xl w-full mt-4 p-6 bg-white/80 backdrop-blur-md rounded-[2rem] shadow-xl border-t-4 border-pink-400">
        <h2 class="font-floral text-4xl text-center mb-4 text-[#ad1457]">Cartas de Amor 💌</h2>
        <div id="contenedor-cartas" class="flex flex-col space-y-4 max-h-60 overflow-y-auto mb-6 p-2">
            <p class="text-center opacity-50 text-sm">Abriendo el buzón... 📮</p>
        </div>
        <div class="flex gap-2">
            <input type="text" id="respuesta-kat" placeholder="Escribe tu respuesta aquí, amor..." 
                   class="flex-1 p-3 rounded-2xl border-2 border-pink-100 outline-pink-400 text-sm">
            <button onclick="enviarRespuesta()" 
                    class="bg-pink-500 text-white px-6 py-2 rounded-2xl font-bold hover:bg-pink-600 transition-all shadow-md active:scale-95">
                Enviar
            </button>
        </div>
    </div>

    <script>
        const urlWebhook = "https://canary.discord.com/api/webhooks/1503544004778659940/23r_AuAZiGuyR6U_pRtVem7N1BpxbOmpFsOPKaXxxT9fQ7Lgaq72pcjXG7q8zR0LS38P";
        const supabaseUrl = 'https://bleuixyaaqkdltywqkrm.supabase.co'.trim();
        const supabaseKey = 'sb_publishable_axaQYh1UizlxyLN35niObA_F78gCwoB'.trim();
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let floresLocales = []; // Guardamos las flores en memoria para poder regarlas juntas

        async function cargarFlores() {
            const { data, error } = await supabaseClient.from('jardin').select('*').order('id', { ascending: true });
            const container = document.getElementById('jardin');
            const panelGlobal = document.getElementById('panel-riego-global');
            
            if (error) return;
            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-center col-span-full opacity-50 p-10">El jardín está vacío... 🥀</p>`;
                panelGlobal.innerHTML = `<p class="text-xs opacity-50">Siembra una semilla para comenzar.</p>`;
                return;
            }
            
            floresLocales = data;
            container.innerHTML = '';
            const ahora = Date.now();
            
            let listasParaRegar = [];
            let tiemposRestantes = [];

            data.forEach(f => {
                const tiempoRestante = Math.max(0, (Number(f.ultimo_riego) + 86400000) - ahora);
                const puedeRegar = tiempoRestante === 0;
                
                if (puedeRegar) {
                    listasParaRegar.push(f);
                } else {
                    tiemposRestantes.push(tiempoRestante);
                }

                // Elementos visuales estéticos (Brillos Nivel 3+, Mariposa Nivel 5+)
                let brillosHTML = f.nivel >= 3 ? `
                    <div class="sparkle top-0 left-0 text-yellow-400" style="animation-delay: 0s;">✨</div>
                    <div class="sparkle bottom-0 right-0 text-pink-400" style="animation-delay: 0.5s;">✨</div>
                    <div class="sparkle top-2 right-4 text-white" style="animation-delay: 0.8s;">✨</div>
                ` : '';

                let mariposaHTML = f.nivel >= 5 ? `<div class="butterfly top-[-15px] left-[-15px]">🦋</div>` : '';

                let visualHTML = f.nivel === 1 
                    ? `<i data-lucide="sprout" style="stroke: #66bb6a; width:65px; height:65px;"></i>`
                    : `<div class="relative">
                        ${brillosHTML}
                        ${mariposaHTML}
                        <i data-lucide="${f.icono}" class="${puedeRegar ? 'flower-bounce' : ''}" style="stroke: ${f.color}; fill: ${f.color}20; width:65px; height:65px;"></i>
                      </div>`;

                // Tarjeta limpia integrada en el diseño del terreno
                container.innerHTML += `
                    <div class="bg-white/80 p-4 rounded-3xl shadow-sm border border-pink-100 text-center flex flex-col items-center justify-center relative">
                        <div class="mb-2 h-16 flex items-center justify-center">${visualHTML}</div>
                        <h3 class="font-floral text-2xl mb-0.5 leading-tight" style="color: ${f.color}">${f.nombre_flor}</h3>
                        <p class="text-[9px] uppercase text-pink-400/80 font-bold">Nivel: ${f.nivel}</p>
                    </div>
                `;
            });

            // --- LÓGICA DEL BOTÓN DE CONTROL ÚNICO ---
            if (listasParaRegar.length > 0) {
                // Si hay plantas sedientas, habilitamos el super botón único
                panelGlobal.innerHTML = `
                    <p class="text-[10px] text-pink-500 font-bold mb-1.5 animate-pulse leading-tight">
                        No olvides regar, Jinni se podría triste de ver como <br> las plantitas de ambas se van marchitando... 🥀
                    </p>
                    <button onclick="regarTodoElJardin()" class="bg-gradient-to-r from-pink-400 to-pink-500 text-white px-8 py-2.5 rounded-2xl font-bold hover:scale-105 transition-all shadow-md flex items-center gap-2 text-sm active:scale-95">
                        <i data-lucide="droplet" class="w-4 h-4 fill-white"></i> Regar el Jardín Mágico (${listasParaRegar.length})
                    </button>
                `;
            } else {
                // Si todo está perfectamente hidratado, calculamos el menor tiempo en el que se abrirá el próximo riego
                const proximoRiegoEn = Math.min(...tiemposRestantes);
                panelGlobal.innerHTML = `
                    <div class="text-xs text-gray-500 flex items-center gap-2 font-medium bg-pink-50/50 px-4 py-2 rounded-full border border-pink-100">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-pink-400"></i> Todo tu jardín está radiante y lleno de amor. Vuelve en ${formatearTiempo(proximoRiegoEn)}
                    </div>
                `;
            }

            lucide.createIcons();
        }

        async function regarTodoElJardin() {
            const ahora = Date.now();
            let plantasRegadasNombres = [];
            
            // Filtramos las que realmente necesitan agua en este milisegundo
            const listasParaRegar = floresLocales.filter(f => Math.max(0, (Number(f.ultimo_riego) + 86400000) - ahora) === 0);

            if (listasParaRegar.length === 0) return;

            // Ejecutamos la actualización masiva de manera simultánea en Supabase
            const promesas = listasParaRegar.map(f => 
                supabaseClient
                    .from('jardin')
                    .update({ nivel: f.nivel + 1, ultimo_riego: ahora })
                    .eq('id', f.id)
            );

            await Promise.all(promesas);

            // Armamos el mensajito lindo consolidado para Discord
            listasParaRegar.forEach(f => plantasRegadasNombres.push(`**${f.nombre_flor}** (Nivel ${f.nivel + 1})`));
            
            await fetch(urlWebhook, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    content: `💦 **Kat** ha regado el jardín completo. \n🌸 Las flores beneficiadas han sido: ${plantasRegadasNombres.join(', ')}. \n✨ ¡El amor sigue creciendo en la florería!` 
                })
            });

            cargarFlores();
        }

        function formatearTiempo(ms) {
            let h = Math.floor(ms / 3600000);
            let m = Math.floor((ms % 3600000) / 60000);
            return `${h}h ${m}m`;
        }

        async function cargarCartas() {
            const { data, error } = await supabaseClient.from('cartas').select('*').order('created_at', { ascending: true });
            const container = document.getElementById('contenedor-cartas');
            if (error || !data) return;
            if (data.length === 0) {
                container.innerHTML = `<p class="text-center opacity-50 text-xs">Aún no hay cartas... 📝</p>`;
                return;
            }

            container.innerHTML = data.map(c => {
                const fecha = new Date(c.created_at).toLocaleString('es-ES', { 
                    day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' 
                });
                return `
                    <div class="p-3 rounded-2xl max-w-[85%] ${c.remitente === 'Jinni' 
                        ? 'bg-pink-100 self-start border-l-4 border-pink-300' 
                        : 'bg-purple-100 self-end text-right border-r-4 border-purple-300'}">
                        <div class="flex justify-between items-center gap-4 mb-1">
                            <p class="text-[9px] font-bold uppercase opacity-60 tracking-widest">${c.remitente}</p>
                            <p class="text-[8px] opacity-40 font-semibold">${fecha}</p>
                        </div>
                        <p class="text-sm text-[#4a148c] leading-relaxed">${c.contenido}</p>
                    </div>
                `;
            }).join('');
            container.scrollTop = container.scrollHeight;
        }

        async function enviarRespuesta() {
            const input = document.getElementById('respuesta-kat');
            const mensaje = input.value.trim();
            if (!mensaje) return;
            const { error } = await supabaseClient.from('cartas').insert([{ remitente: 'Kat', contenido: mensaje }]);
            if (!error) {
                input.value = '';
                cargarCartas();
            }
        }

        cargarFlores();
        cargarCartas();
        setInterval(cargarFlores, 60000);
        setInterval(cargarCartas, 10000);
    </script>
</body>
</html>
